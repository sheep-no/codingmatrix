<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>博客内容管理系统</title>
    <!-- 引入 Element Plus 样式 -->
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
    <!-- 引入 Vue 3 的 CDN 版本 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <!-- 引入 Vue Router 的 CDN 版本 -->
    <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.prod.js"></script>
    <!-- 引入 Pinia 的 CDN 版本 -->
    <script src="https://unpkg.com/pinia@2.0.14/dist/pinia.global.prod.js"></script>
    <!-- 引入 Axios 的 CDN 版本 -->
    <script src="https://unpkg.com/axios@1.6.2/dist/axios.min.js"></script>
    <!-- 引入 Element Plus 组件 -->
    <script src="https://unpkg.com/element-plus/dist/index.umd.js"></script>
    <style>
        /* 响应式基础样式 */
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
        }
        .container {
            padding: 20px;
        }
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div id="app" class="container">
        <!-- 应用内容将在此渲染 -->
    </div>

    <!-- Vue 应用入口脚本 -->
    <script>
        // 等待所有依赖加载完成后初始化应用
        window.addEventListener('DOMContentLoaded', () => {
            // 基础 Vue 应用初始化
            const { createApp } = Vue;
            const { createPinia } = Pinia;
            const { createRouter, createWebHistory } = VueRouter;
            const { ElMessage, ElMessageBox } = ElementPlus;

            // 初始化 Pinia
            const pinia = createPinia();
            // 初始化路由（暂时为空，后续将替换为实际路由配置）
            const router = createRouter({
                history: createWebHistory(),
                routes: []
            });

            // 创建应用
            const app = createApp({});

            // 使用 Pinia 和 Vue Router
            app.use(pinia);
            app.use(router);
            app.use(ElementPlus, {
                ElMessage,
                ElMessageBox
            });

            // 挂载应用
            app.mount('#app');
        });
    </script>
</body>
</html>
