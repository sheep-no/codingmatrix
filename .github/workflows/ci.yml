name: CI/CD Auto Test

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    strategy:
      matrix:
        python-version: ["3.11"]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/configs/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
          python -m pip install --upgrade pip
          pip install -r configs/requirements.txt
          pip install -r configs/requirements-test.txt

    - name: Lint backend (ruff)
      run: ruff check app

    - name: Typecheck new modules (mypy)
      run: mypy

    - name: Security audit (pip-audit)
      run: |
        pip install pip-audit
        # ecdsa/python-jose 暂无修复版本；soupsieve 修复版要求 Python >= 3.11.5；
        # opentelemetry 1.45 与 jaeger-thrift 1.21 不兼容。其余新增漏洞一律阻断合并。
        pip-audit \
          --format json \
          --output pip-audit-results.json \
          --ignore-vuln PYSEC-2026-1325 \
          --ignore-vuln PYSEC-2026-4298 \
          --ignore-vuln GHSA-mmhr-3c5m-f64f \
          --ignore-vuln GHSA-7g44-g9rc-x53w \
          --ignore-vuln GHSA-6655-6qjp-jx7x \
          --ignore-vuln GHSA-xcq7-p3pf-p88h \
          --ignore-vuln GHSA-mf5v-w3w3-f6cg

    - name: Upload pip-audit results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pip-audit-results-python${{ matrix.python-version }}
        path: pip-audit-results.json
        retention-days: 30

    - name: Setup environment
      run: |
        cp .env.example .env || true
        echo "SILICONFLOW_API_KEY=test_key" >> .env
        echo "SECRET_KEY=test_secret_key_for_ci_test" >> .env
        echo "DATABASE_URL=sqlite+aiosqlite:///./test.db" >> .env

    - name: Run pytest tests
      run: |
          PYTHONPATH=$PWD:$PYTHONPATH pytest \
          -v \
          --tb=short \
          --maxfail=5 \
          -o log_cli=true \
          -o log_cli_level=INFO \
          --cov=app \
          --cov=src \
          --cov-config=pyproject.toml \
          --cov-report=xml \
          --cov-report=html \
          --cov-report=term-missing \
          --junitxml=test-results.xml \
          --timeout=600

    - name: Upload coverage reports
      if: always()
      uses: codecov/codecov-action@v5
      with:
        file: ./coverage.xml
        flags: unittests
        fail_ci_if_error: false

    - name: Upload HTML coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-python${{ matrix.python-version }}
        path: htmlcov/
        retention-days: 7

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-python${{ matrix.python-version }}
        path: |
          test-results.xml
          .pytest_cache/
          logs/
        retention-days: 7

  mysql-integration:
    name: MySQL 8.4 Runtime Integration
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: ai_agent_test
          MYSQL_USER: ai_agent
          MYSQL_PASSWORD: ai_agent_test_pw
          MYSQL_ROOT_PASSWORD: root_test_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-mysql-pip-${{ hashFiles('**/configs/requirements.txt', '**/configs/requirements-test.txt') }}
        restore-keys: |
          ${{ runner.os }}-mysql-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r configs/requirements.txt
        pip install -r configs/requirements-test.txt

    - name: Run MySQL runtime integration tests
      env:
        MYSQL_TEST_URL: mysql+aiomysql://ai_agent:ai_agent_test_pw@127.0.0.1:3306/ai_agent_test?charset=utf8mb4
        SECRET_KEY: test_secret_key_for_ci_test
        SILICONFLOW_API_KEY: test_key
      run: |
        PYTHONPATH=$PWD:$PYTHONPATH pytest \
          tests/integration/test_mysql_runtime.py \
          -p no:randomly \
          --timeout=300
