name: E2E Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_pattern:
        description: 'Test file pattern (e.g., 01-auth.spec.js)'
        required: false
        default: ''

jobs:
  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1/3, 2/3, 3/3]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set environment variables
        run: |
          echo "REDIS_HOST=localhost" >> $GITHUB_ENV
          echo "REDIS_PORT=6379" >> $GITHUB_ENV
          echo "DATABASE_URL=sqlite:///./test.db" >> $GITHUB_ENV
          echo "SECRET_KEY=test-secret-key-for-ci-only" >> $GITHUB_ENV
          echo "ALLOWED_HOSTS=localhost,127.0.0.1" >> $GITHUB_ENV

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-e2e-pip-${{ hashFiles('configs/requirements.txt', 'configs/requirements-test.txt') }}
          restore-keys: |
            ${{ runner.os }}-e2e-pip-

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            src/node_modules
            node_modules
          key: ${{ runner.os }}-e2e-node-modules-${{ hashFiles('src/package-lock.json', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-e2e-node-modules-

      - name: Install frontend dependencies
        run: |
          cd src && npm ci

      - name: Install E2E dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r configs/requirements.txt
          pip install -r configs/requirements-test.txt

      - name: Run database migrations
        run: |
          python -m app.db_migrate

      - name: Initialize RSA keys
        run: |
          python -c "from app.utils.crypto import RSAKeyManager; RSAKeyManager.get_instance()"

      - name: Start backend server
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          echo "BACKEND_PID=$!" >> $GITHUB_ENV
          # Wait for backend to be ready
          for i in $(seq 1 30); do
            if curl -s http://localhost:8000/health > /dev/null 2>&1; then
              echo "Backend is ready"
              break
            fi
            sleep 2
          done

      - name: Start frontend dev server
        run: |
          cd src && npm run dev -- --port 3000 &
          echo "FRONTEND_PID=$!" >> $GITHUB_ENV

      - name: Wait for services
        run: |
          for i in $(seq 1 30); do
            if curl -s http://localhost:8000/health > /dev/null 2>&1 && curl -s http://localhost:3000/ > /dev/null 2>&1; then
              echo "Services are ready"
              break
            fi
            sleep 2
          done

      - name: Run E2E tests
        run: |
          if [ -n "${{ github.event.inputs.test_pattern }}" ]; then
             npx playwright test tests/e2e/${{ github.event.inputs.test_pattern }} --shard=${{ matrix.shard }}
           else
             npx playwright test --shard=${{ matrix.shard }}
           fi
        env:
          BASE_URL: http://localhost:3000
          BACKEND_URL: http://localhost:8000
        continue-on-error: false

      - name: Check test coverage
        run: |
          echo "Test coverage report will be generated in future iterations"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-recordings
          path: test-results/
          retention-days: 30

      - name: Stop services
        if: always()
        run: |
          kill $BACKEND_PID 2>/dev/null || true
          kill $FRONTEND_PID 2>/dev/null || true
