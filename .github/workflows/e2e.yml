name: E2E Tests

on:
  pull_request:
    branches: [main]

jobs:
  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-e2e-pip-${{ hashFiles('requirements.txt', 'requirements-test.txt') }}
          restore-keys: |
            ${{ runner.os }}-e2e-pip-

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            src/node_modules
            node_modules
          key: ${{ runner.os }}-e2e-node-modules-${{ hashFiles('src/package-lock.json', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-e2e-node-modules-

      - name: Install frontend dependencies
        run: |
          cd src && npm ci

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Start backend server
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8080 &
          echo "BACKEND_PID=$!" >> $GITHUB_ENV

      - name: Start frontend dev server
        run: |
          cd src && npm run dev -- --port 5173 &
          echo "FRONTEND_PID=$!" >> $GITHUB_ENV

      - name: Wait for services
        run: |
          for i in $(seq 1 30); do
            if curl -s http://localhost:8080/ > /dev/null 2>&1 && curl -s http://localhost:5173/ > /dev/null 2>&1; then
              echo "Services are ready"
              break
            fi
            sleep 2
          done

      - name: Run E2E tests
        run: npx playwright test
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-recordings
          path: test-results/
          retention-days: 30

      - name: Stop services
        if: always()
        run: |
          kill $BACKEND_PID 2>/dev/null || true
          kill $FRONTEND_PID 2>/dev/null || true
