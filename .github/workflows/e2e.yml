name: E2E Tests

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      test_pattern:
        description: '留空运行核心用例集；也可填单个 spec 文件名（如 core.spec.js）'
        required: false
        default: ''

jobs:
  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set environment variables
        run: |
          # 统一 127.0.0.1：localhost 在部分 runner 上解析为 ::1，而服务只监听 IPv4
          echo "REDIS_HOST=127.0.0.1" >> $GITHUB_ENV
          echo "REDIS_PORT=6379" >> $GITHUB_ENV
          # 必须用异步驱动 sqlite+aiosqlite：应用以 create_async_engine 建引擎
          echo "DATABASE_URL=sqlite+aiosqlite:///./test.db" >> $GITHUB_ENV
          echo "SECRET_KEY=test-secret-key-for-ci-only" >> $GITHUB_ENV
          echo "ALLOWED_HOSTS=127.0.0.1,localhost" >> $GITHUB_ENV
          # 与 app/scripts/seed_users.py 的固定密码保持一致
          echo "TEST_ADMIN_EMAIL=mr_yang@example.com" >> $GITHUB_ENV
          echo "TEST_ADMIN_PASSWORD=12345678" >> $GITHUB_ENV

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-e2e-pip-${{ hashFiles('configs/requirements.txt', 'configs/requirements-test.txt') }}
          restore-keys: |
            ${{ runner.os }}-e2e-pip-

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            src/node_modules
            node_modules
          key: ${{ runner.os }}-e2e-node-modules-${{ hashFiles('src/package-lock.json', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-e2e-node-modules-

      - name: Install frontend dependencies
        run: cd src && npm ci

      - name: Install E2E dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r configs/requirements.txt
          pip install -r configs/requirements-test.txt

      - name: Start backend server
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          echo "BACKEND_PID=$!" >> $GITHUB_ENV
          # 应用启动时会执行数据库迁移并生成 RSA 密钥，无需单独初始化
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:8000/api/v1/health > /dev/null 2>&1; then
              echo "Backend is ready"
              break
            fi
            sleep 2
          done

      - name: Seed test users
        run: python -m app.scripts.seed_users

      - name: Start frontend dev server
        run: |
          cd src && npm run dev -- --host 127.0.0.1 --port 3000 &
          echo "FRONTEND_PID=$!" >> $GITHUB_ENV

      - name: Wait for services
        run: |
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:8000/api/v1/health > /dev/null 2>&1 && curl -s http://127.0.0.1:3000/ > /dev/null 2>&1; then
              echo "Services are ready"
              break
            fi
            sleep 2
          done

      - name: Run E2E tests
        run: |
          # 门禁仅纳入已实测稳定的非 Agent spec；其余 spec 依赖外部模型或选择器待修，
          # 不进 CI，避免门禁随机失败。新增 spec 前需本地串行与并行各跑一遍确认零失败。
          CORE_SPECS="tests/e2e/core.spec.js tests/e2e/01-auth.spec.js tests/e2e/02-core-navigation.spec.js tests/e2e/11-theme-shortcuts.spec.js tests/e2e/encrypted-login.spec.js tests/e2e/theme-switcher.spec.js tests/e2e/10-admin.spec.js tests/e2e/tools.spec.js tests/e2e/tools-panel.spec.js tests/e2e/capability-center.spec.js tests/e2e/admin-panel-scenarios.spec.js"
          if [ -n "${{ github.event.inputs.test_pattern }}" ]; then
            npx playwright test "tests/e2e/${{ github.event.inputs.test_pattern }}"
          else
            npx playwright test $CORE_SPECS
          fi
        env:
          BASE_URL: http://127.0.0.1:3000
          BACKEND_URL: http://127.0.0.1:8000

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-recordings
          path: test-results/
          retention-days: 30

      - name: Stop services
        if: always()
        run: |
          kill $BACKEND_PID 2>/dev/null || true
          kill $FRONTEND_PID 2>/dev/null || true
