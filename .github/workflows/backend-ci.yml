name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'

jobs:
  test:
    name: Test & Lint Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-backend-pip-${{ hashFiles('configs/requirements.txt', 'configs/requirements-test.txt') }}
          restore-keys: |
            ${{ runner.os }}-backend-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r configs/requirements.txt
          pip install -r configs/requirements-test.txt
          pip install ruff

      - name: Security audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit --format json --output pip-audit-results.json || true

      - name: Upload pip-audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-results-backend
          path: pip-audit-results.json
          retention-days: 30

      - name: Run lint
        run: ruff check app/

      - name: Run tests
        run: pytest
