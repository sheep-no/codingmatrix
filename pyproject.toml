# 覆盖率配置 (pytest-cov)
[tool.coverage.run]
branch = true
source = ["app", "src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/conftest.py",
    "*/alembic/*",
    "*/migrations/*",
    "*node_modules*",
    "*/venv/*",
    "*/.venv/*",
    "*/__pycache__/*",
    "*/.git/*"
]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["-v", "--tb=short", "--strict-markers", "--disable-warnings"]
markers = [
    "api: API 接口测试",
    "asyncio: 异步测试",
    "database: 数据库相关测试",
    "integration: 集成测试",
    "guardian: Guardian 相关测试",
    "logging: 日志相关测试",
    "monitoring: 监控相关测试",
    "security: 安全性测试",
    "smoke: 冒烟测试",
    "unit: 单元测试",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "except ImportError:",
    "if sys.platform ==",
    "if os.name ==",
    "if DEBUG:",
    "if settings.DEBUG",
    "logger\\.",
    "log\\.",
    "except Exception:",
]
fail_under = 70
show_missing = true
sort = "Cover"
precision = 2

[tool.coverage.html]
directory = "htmlcov"
title = "Coverage Report"

[tool.coverage.xml]
output = "coverage.xml"
