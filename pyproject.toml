# 覆盖率配置 (pytest-cov)
[tool.coverage.run]
branch = true
source = ["app", "src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/conftest.py",
    "*/alembic/*",
    "*/migrations/*",
    "*node_modules*",
    "*/venv/*",
    "*/.venv/*",
    "*/__pycache__/*",
    "*/.git/*"
]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["-v", "--tb=short", "--strict-markers", "--disable-warnings"]
markers = [
    "api: API 接口测试",
    "asyncio: 异步测试",
    "database: 数据库相关测试",
    "integration: 集成测试",
    "guardian: Guardian 相关测试",
    "logging: 日志相关测试",
    "monitoring: 监控相关测试",
    "security: 安全性测试",
    "smoke: 冒烟测试",
    "unit: 单元测试",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "except ImportError:",
    "if sys.platform ==",
    "if os.name ==",
    "if DEBUG:",
    "if settings.DEBUG",
    "logger\\.",
    "log\\.",
    "except Exception:",
]
# 棘轮基线：实测长期保持 100%，阈值贴近实测值以阻止覆盖率回退
fail_under = 95
show_missing = true
sort = "Cover"
precision = 2

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# 启用 pyflakes、import 顺序与语法错误；F403/F405 的星号导入存量另行推进
select = ["E9", "F", "I"]
ignore = ["F403", "F405"]

[tool.mypy]
python_version = "3.11"
files = [
    "app/core/llm_errors.py",
    "app/core/version.py",
    "app/agent/retrieval/local_context.py",
    "app/agent/orchestrator_generation/coverage_checker.py",
    "app/api/v1/health.py",
    "app/services/generation_runtime.py",
]
# 存量代码尚无类型基线，先只检查新增模块；后续按领域逐步扩大 files。
follow_imports = "skip"
ignore_missing_imports = true
check_untyped_defs = true

[tool.coverage.html]
directory = "htmlcov"
title = "Coverage Report"

[tool.coverage.xml]
output = "coverage.xml"
