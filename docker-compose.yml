# =============================================================================
# Docker Compose 配置
# 2核4G 服务器优化版
# =============================================================================

services:
  # AI Agent API 服务
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-agent-api
    restart: unless-stopped
    # 本地 compose 不设 user: appuser（与 docker-compose.prod.yml 相反）：这里的
    # ./logs、./data、./uploads 等是 bind mount，宿主机目录属主为当前用户，
    # 切到 appuser 会失去写权限。本地以 root 运行，生产 compose 才以 appuser 运行
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - ENV=production
      - REDIS_URL=redis://redis:6379/0
      - DB_POOL_SIZE=3
      - DB_MAX_OVERFLOW=5
      - WS_MAX_CONNECTIONS=50
      - LOG_LEVEL=WARNING
      - ENABLE_SCHEDULER=true
      # 与 celery 共用同一 SQLite 文件；缺省会落到容器内 /app/app.db，
      # 各容器各自独立，celery 看不到 API 写入的数据
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:////app/data/app.db}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - METRICS_TOKEN=${METRICS_TOKEN:-}
      # 告警转发渠道（可选）；留空时只写结构化日志
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
      - ALERT_WEBHOOK_TYPE=${ALERT_WEBHOOK_TYPE:-generic}
      - ALERT_NOTIFY_MIN_SEVERITY=${ALERT_NOTIFY_MIN_SEVERITY:-warning}
      - ALERT_SMTP_HOST=${ALERT_SMTP_HOST:-}
      - ALERT_SMTP_PORT=${ALERT_SMTP_PORT:-587}
      - ALERT_SMTP_SECURITY=${ALERT_SMTP_SECURITY:-starttls}
      - ALERT_SMTP_USER=${ALERT_SMTP_USER:-}
      - ALERT_SMTP_PASSWORD=${ALERT_SMTP_PASSWORD:-}
      - ALERT_SMTP_FROM=${ALERT_SMTP_FROM:-}
      - ALERT_SMTP_TO=${ALERT_SMTP_TO:-}
      # 与 celery 共用同一密钥卷，避免各容器各自生成 RSA 密钥
      - RSA_KEY_DIR=/app/keys
      # 可选：设置后私钥以口令加密落盘，留空则保持明文（仅 0o600 权限保护）
      - RSA_KEY_PASSPHRASE=${RSA_KEY_PASSPHRASE:-}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --workers 1
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
      - ./data:/app/data
      - ./configs/system_config.json:/app/configs/system_config.json
      - api-keys:/app/keys
      - ./uploads:/app/uploads
      - ./pptx_output:/app/pptx_output
      - ./generated_images:/app/generated_images
      - ./projects:/app/projects
    depends_on:
      - redis
    networks:
      - ai-agent-net
    mem_limit: 1.5g
    memswap_limit: 2g
    cpus: 1.5

  # Celery Worker
  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-agent-celery
    restart: unless-stopped
    # 同 api：本地为 bind mount，不设 user: appuser
    command: celery -A app.celery_app worker --loglevel=warning --concurrency=1 --max-tasks-per-child=50
    environment:
      - ENV=production
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=WARNING
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:////app/data/app.db}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - RSA_KEY_DIR=/app/keys
      - RSA_KEY_PASSPHRASE=${RSA_KEY_PASSPHRASE:-}
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
      - ./data:/app/data
      - ./configs/system_config.json:/app/configs/system_config.json
      - api-keys:/app/keys
      - ./uploads:/app/uploads
      - ./pptx_output:/app/pptx_output
      - ./generated_images:/app/generated_images
      - ./projects:/app/projects
    depends_on:
      - redis
    networks:
      - ai-agent-net
    mem_limit: 512m
    cpus: 0.5

  # Redis 缓存/消息队列
  redis:
    image: redis:7-alpine
    container_name: ai-agent-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - ai-agent-net
    mem_limit: 320m
    cpus: 0.25

  # Nginx 反向代理 + 静态文件服务
  nginx:
    image: nginx:alpine
    container_name: ai-agent-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./configs/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./configs/nginx-upstream-compose.conf:/etc/nginx/conf.d/upstream.conf:ro
      - ./src/dist:/workspace/src/dist:ro
    depends_on:
      - api
    networks:
      - ai-agent-net
    mem_limit: 128m
    cpus: 0.25

  # =============================================================================
  # OpenTelemetry / Jaeger（可选：docker compose --profile observability up 启用）
  # 访问 http://localhost:16686 查看 Jaeger UI
  # =============================================================================
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: ai-agent-jaeger
    profiles: ["observability"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:16686:16686"   # Jaeger UI
      - "127.0.0.1:14268:14268"   # Jaeger HTTP Collector
      - "127.0.0.1:14250:14250"   # Jaeger gRPC Collector
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - ai-agent-net
    mem_limit: 256m
    cpus: 0.25

  # =============================================================================
  # Prometheus + Alertmanager（可选：docker compose --profile observability up 启用）
  # 共享卷里的 metrics_token 用于抓取和告警回调鉴权，值来自 METRICS_TOKEN
  # =============================================================================
  metrics-init:
    image: alpine:3.20
    container_name: ai-agent-metrics-init
    profiles: ["observability"]
    restart: "no"
    command:
      - sh
      - -c
      - >-
        test -n "$$METRICS_TOKEN" ||
        { echo "METRICS_TOKEN must be set for observability profile" >&2; exit 1; };
        printf %s "$$METRICS_TOKEN" > /token/metrics_token
    environment:
      - METRICS_TOKEN=${METRICS_TOKEN:-}
    volumes:
      - metrics-token:/token
    networks:
      - ai-agent-net
    mem_limit: 32m
    cpus: 0.05

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: ai-agent-prometheus
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.listen-address=0.0.0.0:9090
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./configs/prometheus.compose.yml:/etc/prometheus/prometheus.yml:ro
      - ./configs/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - metrics-token:/etc/monitoring:ro
      - prometheus-data:/prometheus
    depends_on:
      metrics-init:
        condition: service_completed_successfully
      api:
        condition: service_started
    networks:
      - ai-agent-net
    mem_limit: 256m
    cpus: 0.25

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: ai-agent-alertmanager
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=0.0.0.0:9093
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./configs/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - metrics-token:/etc/monitoring:ro
      - alertmanager-data:/alertmanager
    depends_on:
      metrics-init:
        condition: service_completed_successfully
      api:
        condition: service_started
    networks:
      - ai-agent-net
    mem_limit: 128m
    cpus: 0.1

volumes:
  api-keys:
    driver: local
  metrics-token:
    driver: local
  prometheus-data:
    driver: local
  alertmanager-data:
    driver: local

networks:
  ai-agent-net:
    driver: bridge
