# PPT 模板配置文件
# 统一管理前后端模板配置，消除名称不匹配问题

templates:
  # 现代简约
  modern:
    id: "modern"
    name: "现代简约"
    name_en: "Modern Minimal"
    description: "简洁清晰的现代风格，适合大多数场景"
    category: "general"
    colors:
      primary: "#2563eb"
      secondary: "#64748b"
      accent: "#3b82f6"
      background: "#ffffff"
      text: "#1e293b"
      text_light: "#64748b"
    fonts:
      title: "Arial, sans-serif"
      body: "Arial, sans-serif"
      title_size: 32
      body_size: 18
    layouts:
      - title_slide
      - content_with_image
      - two_column
      - bullet_list
    animations:
      default: "fade"
      supported:
        - fade
        - slide_left
        - slide_right
        - zoom
    thumbnail: "/static/templates/modern.png"
    is_default: true

