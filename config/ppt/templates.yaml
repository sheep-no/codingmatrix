# 全局设置
settings:
  # 默认模板 ID
  default_template: "modern"
  
  # 动画配置
  animations:
    # 动画持续时间（秒）
    duration: 0.5
    # 动画延迟（秒）
    delay: 0.1
  
  # 布局配置
  layouts:
    # 幻灯片尺寸
    slide_width: 10
    slide_height: 7.5
    # 边距（英寸）
    margin: 0.5
  
  # 文本配置
  text:
    # 最大标题字数
    max_title_length: 50
    # 最大内容行数
    max_content_lines: 8
    # 最小字号
    min_font_size: 12
    # 最大字号
    max_font_size: 48
  
  # 图片配置
  images:
    # 默认图片宽度（像素）
    default_width: 1920
    # 默认图片高度（像素）
    default_height: 1080
    # 图片下载超时（秒）
    download_timeout: 10
    # 最大并发数
    max_concurrent: 5
