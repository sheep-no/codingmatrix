# 强制多角度审查清单
# Agent 在影响分析阶段使用，确保修改经过全面审查

checklists:
  # 兼容性审查
  compatibility:
    - "API 接口签名是否变更？如有变更是否影响前端/其他调用方？"
    - "数据库 Schema 是否有变更？是否需要迁移脚本？"
    - "配置项是否有变更？是否影响已有部署？"
    - "删除的函数/类是否被其他地方引用？（查依赖图谱）"

  # 安全审查
  security:
    - "是否有新的用户输入点？是否做了输入验证？"
    - "是否有新的文件操作？是否检查了路径安全性？"
    - "是否有新的数据库查询？是否使用参数化查询？"
    - "是否有新的权限变更？是否正确校验了用户角色？"
    - "是否引入了新的外部依赖？是否存在已知漏洞？"
    - "是否遵循了守护合约规则（GC-XXX）？"

  # 性能审查
  performance:
    - "是否有新增的数据库查询？是否会造成 N+1 问题？"
    - "是否有循环中的 I/O 操作？是否可以批量处理？"
    - "是否有大的数据集加载到内存？是否可以流式处理？"
    - "是否有不必要的重复计算？是否可以缓存？"

  # 测试审查
  testing:
    - "是否编写/更新了相关测试用例？"
    - "测试是否覆盖了正常路径和异常路径？"
    - "测试是否覆盖了边缘情况？（空值、超大值、并发）"
    - "运行关联测试是否全部通过？（查 file_to_test_map.yaml）"

  # 文档审查
  documentation:
    - "API 文档是否需要更新？"
    - "README 或开发者指南是否需要更新？"
    - "变更日志（Changelog）是否需要记录？"
    - "配置说明是否需要更新？"

  # 运维审查
  operations:
    - "部署脚本是否需要更新？"
    - "环境变量是否需要新增？"
    - "监控/告警是否需要调整？"
    - "日志记录是否充分？是否包含足够的调试信息？"
