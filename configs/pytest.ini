[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

asyncio_mode = auto

# 输出配置
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# 标记配置
markers =
    api: API 接口测试
    selenium: Selenium E2E 测试
    slow: 慢速测试
    security: 安全性测试
    smoke: 冒烟测试

# 超时配置（秒）
timeout = 300
