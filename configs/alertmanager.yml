# Alertmanager routes the LLM provider alerts to the API webhook sink.

global:
  resolve_timeout: 5m

route:
  receiver: api-webhook
  group_by: ['alertname', 'provider', 'model']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: api-webhook
    webhook_configs:
      - url: 'http://api:8080/api/v1/health/alerts'
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/monitoring/metrics_token
