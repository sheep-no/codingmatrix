# =============================================================================
# Docker Compose - Production Configuration
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Backend API Service
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-agent-api-prod
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --workers 2
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - ENV=production
      - REDIS_URL=redis://redis:6379/0
      - DB_POOL_SIZE=5
      - DB_MAX_OVERFLOW=10
      - WS_MAX_CONNECTIONS=100
      - LOG_LEVEL=INFO
      - ENABLE_SCHEDULER=false
    volumes:
      - api-logs:/app/logs
      - api-data:/app/data
      - ppt-artifacts:/app/pptx_output
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ai-agent-prod-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1.5G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ---------------------------------------------------------------------------
  # Celery Worker
  # ---------------------------------------------------------------------------
  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-agent-celery-prod
    restart: always
    command: celery -A app.celery_app worker --loglevel=info --concurrency=1 --max-tasks-per-child=50
    healthcheck:
      disable: true
    environment:
      - ENV=production
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=INFO
    volumes:
      - api-logs:/app/logs
      - api-data:/app/data
      - ppt-artifacts:/app/pptx_output
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ai-agent-prod-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  # ---------------------------------------------------------------------------
  # Scheduler
  # ---------------------------------------------------------------------------
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-agent-scheduler-prod
    restart: always
    command: python -m app.db.scheduler_runner
    healthcheck:
      disable: true
    environment:
      - ENV=production
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///./data/app.db}
    volumes:
      - api-data:/app/data
      - api-logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ai-agent-prod-net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  # ---------------------------------------------------------------------------
  # Redis Cache / Message Queue
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ai-agent-redis-prod
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - ai-agent-prod-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 320M
        reservations:
          cpus: '0.1'
          memory: 128M

  # ---------------------------------------------------------------------------
  # Nginx Reverse Proxy
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: ai-agent-nginx-prod
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./configs/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./configs/nginx-upstream-compose.conf:/etc/nginx/conf.d/upstream.conf:ro
      - ./src/dist:/workspace/src/dist:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      api:
        condition: service_healthy
    networks:
      - ai-agent-prod-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M

# ---------------------------------------------------------------------------
# Named Volumes
# ---------------------------------------------------------------------------
volumes:
  api-logs:
    driver: local
  api-data:
    driver: local
  ppt-artifacts:
    driver: local
  redis-data:
    driver: local
  nginx-logs:
    driver: local

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  ai-agent-prod-net:
    driver: bridge
