# =============================================================================
# Docker Compose - Production Configuration
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Backend API Service
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-agent-api-prod
    restart: always
    # command 覆盖了 Dockerfile 的 CMD，其中的 su appuser 不再执行；显式以 appuser
    # 运行，否则 API 以 root 运行。Dockerfile 已 chown -R appuser:appuser /app 并预建
    # 全部挂载点，named volume 首次创建会继承该属主，bind mount 源文件为 644 可读
    user: appuser
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --workers 2
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - ENV=production
      - REDIS_URL=redis://redis:6379/0
      - DB_POOL_SIZE=5
      - DB_MAX_OVERFLOW=10
      - WS_MAX_CONNECTIONS=100
      - LOG_LEVEL=INFO
      - ENABLE_SCHEDULER=false
      # 与 celery/scheduler 共用 api-data 卷上的同一 SQLite 文件；缺省会落到
      # 容器内 /app/app.db（各容器各自独立、重建即丢），导致调度任务看不到 API 数据
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:////app/data/app.db}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      # 与 celery/scheduler 共用同一密钥卷，避免各容器各自生成 RSA 密钥
      - RSA_KEY_DIR=/app/keys
    volumes:
      - api-logs:/app/logs
      - api-data:/app/data
      # api-data 是空卷，会遮蔽镜像内的 data/ 目录；不显式挂载时模型配置缺失，
      # 运行期将静默回退到硬编码默认模型
      - ./data/unified_model_config.yaml:/app/data/unified_model_config.yaml:ro
      - ./data/agent_model_config.yaml:/app/data/agent_model_config.yaml:ro
      - ./configs/system_config.json:/app/configs/system_config.json
      - api-keys:/app/keys
      - ppt-artifacts:/app/pptx_output
      - uploads:/app/uploads
      - generated-images:/app/generated_images
      - projects:/app/projects
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ai-agent-prod-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1.5G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ---------------------------------------------------------------------------
  # Celery Worker
  # ---------------------------------------------------------------------------
  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-agent-celery-prod
    restart: always
    # 同 api：command 覆盖 CMD 会绕过 su appuser
    user: appuser
    command: celery -A app.celery_app worker --loglevel=info --concurrency=1 --max-tasks-per-child=50
    healthcheck:
      disable: true
    environment:
      - ENV=production
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=INFO
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:////app/data/app.db}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - RSA_KEY_DIR=/app/keys
    volumes:
      - api-logs:/app/logs
      - api-data:/app/data
      - ./data/unified_model_config.yaml:/app/data/unified_model_config.yaml:ro
      - ./data/agent_model_config.yaml:/app/data/agent_model_config.yaml:ro
      - ./configs/system_config.json:/app/configs/system_config.json
      - api-keys:/app/keys
      - ppt-artifacts:/app/pptx_output
      - uploads:/app/uploads
      - generated-images:/app/generated_images
      - projects:/app/projects
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ai-agent-prod-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  # ---------------------------------------------------------------------------
  # Scheduler
  # ---------------------------------------------------------------------------
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-agent-scheduler-prod
    restart: always
    # 同 api：command 覆盖 CMD 会绕过 su appuser
    user: appuser
    command: python -m app.db.scheduler_runner
    healthcheck:
      disable: true
    environment:
      - ENV=production
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:////app/data/app.db}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - RSA_KEY_DIR=/app/keys
    volumes:
      - api-data:/app/data
      - ./data/unified_model_config.yaml:/app/data/unified_model_config.yaml:ro
      - ./data/agent_model_config.yaml:/app/data/agent_model_config.yaml:ro
      - ./configs/system_config.json:/app/configs/system_config.json
      - api-keys:/app/keys
      - api-logs:/app/logs
      - ppt-artifacts:/app/pptx_output
      - uploads:/app/uploads
      - generated-images:/app/generated_images
      - projects:/app/projects
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ai-agent-prod-net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  # ---------------------------------------------------------------------------
  # Redis Cache / Message Queue
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ai-agent-redis-prod
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - ai-agent-prod-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 320M
        reservations:
          cpus: '0.1'
          memory: 128M

  # ---------------------------------------------------------------------------
  # Nginx Reverse Proxy
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: ai-agent-nginx-prod
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./configs/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./configs/nginx-upstream-compose.conf:/etc/nginx/conf.d/upstream.conf:ro
      - ./src/dist:/workspace/src/dist:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      api:
        condition: service_healthy
    networks:
      - ai-agent-prod-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M

# ---------------------------------------------------------------------------
# Named Volumes
# ---------------------------------------------------------------------------
volumes:
  api-logs:
    driver: local
  api-data:
    driver: local
  api-keys:
    driver: local
  ppt-artifacts:
    driver: local
  uploads:
    driver: local
  generated-images:
    driver: local
  projects:
    driver: local
  redis-data:
    driver: local
  nginx-logs:
    driver: local

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  ai-agent-prod-net:
    driver: bridge
